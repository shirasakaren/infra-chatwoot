name: terraform-plan

on:
  pull_request:
    paths:
      - "terraform/**"
      - "bootstrap/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  id-token: write     # OIDC assume-role. no long-lived keys in this house.
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-southeast-1
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5
          terraform_wrapper: false

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GHA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform fmt -check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: terraform init (partial backend; read-only)
        env:
          STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          LOCK_TABLE:   ${{ secrets.TF_LOCK_TABLE }}
        run: |
          terraform -chdir=terraform init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="dynamodb_table=${LOCK_TABLE}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="key=chatwoot-ta/terraform.tfstate"

      - name: terraform validate
        run: terraform -chdir=terraform validate

      - name: terraform plan (no apply)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_owner:           ${{ secrets.TF_VAR_OWNER }}
          TF_VAR_name_prefix:     ${{ vars.TF_VAR_NAME_PREFIX }}
          TF_VAR_region:          ${{ env.AWS_REGION }}
          TF_VAR_domain:          ${{ vars.TF_VAR_DOMAIN }}
          TF_VAR_cloudflare_zone: ${{ vars.TF_VAR_CLOUDFLARE_ZONE }}
          TF_VAR_github_owner:    ${{ github.repository_owner }}
          TF_VAR_github_repo:     ${{ github.event.repository.name }}
        run: |
          terraform -chdir=terraform plan -input=false -no-color -lock=false \
            -out=tfplan 2>&1 | tee plan.txt

      - name: Post plan as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8').slice(-65000);
            const body = "### terraform plan\n\n```hcl\n" + plan + "\n```";
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
