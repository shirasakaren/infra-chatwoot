---
# Dynamic inventory of EKS worker nodes. Discovery is scoped by tag so only
# this project's instances appear (additive-only guardrail).
#
# Connection: aws_ssm: Session Manager, no SSH key, no bastion.
# Requires session-manager-plugin locally (preflight checks this).

plugin: amazon.aws.aws_ec2
regions:
  - "{{ lookup('env','AWS_REGION') | default('ap-southeast-1', true) }}"

filters:
  instance-state-name: running
  "tag:eks:cluster-name": "{{ lookup('env','NAME_PREFIX') | default('cwta', true) }}"

keyed_groups:
  - key: tags['eks:nodegroup-name']
    prefix: nodegroup
  - key: placement.availability_zone
    prefix: az

hostnames:
  - instance-id

compose:
  ansible_host: instance_id
  ansible_connection: "'community.aws.aws_ssm'"
  ansible_aws_ssm_bucket_name: "lookup('env','SSM_BUCKET') | default('', true)"
  ansible_aws_ssm_region: "lookup('env','AWS_REGION') | default('ap-southeast-1', true)"
  ansible_aws_ssm_plugin: "'/usr/local/bin/session-manager-plugin'"
  # No bucket means community.aws.aws_ssm falls back to in-band file transfer
  # which works for small writes (LVM playbook uses module exec only).
