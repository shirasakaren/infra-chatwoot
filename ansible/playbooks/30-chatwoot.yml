---
# 30-chatwoot.yml
# Install Chatwoot (community) via the official Helm chart and wire the
# Cloudflare app DNS record to the ALB hostname once it materializes.
# (the ALB hostname is a surprise gift from the ALB controller; we cannot
# know it ahead of time, so we wait for the ingress to tell us. patience.)

- name: Install Chatwoot
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../vars/main.yml

  tasks:
    # add the chatwoot chart repo. the chart lives in github pages like
    # everything else in this ecosystem. fine. fine!
    - name: Add chatwoot helm repo
      kubernetes.core.helm_repository:
        name: chatwoot
        repo_url: "{{ chatwoot_chart_repo }}"

    # render the values template into a temp file with 0600 perms. the file
    # has no secrets in it, but we set 0600 anyway out of pure paranoia.
    # paranoia is a virtue in this repo.
    - name: Render Chatwoot values to a temp file
      ansible.builtin.copy:
        content: "{{ lookup('template', '../templates/chatwoot-values.yaml.j2') }}"
        dest: "/tmp/chatwoot-values.{{ name_prefix }}.yaml"
        mode: "0600"

    # the big install. upgrade --install means re-runs are safe, which is
    # the only kind of run i trust.
    - name: Helm upgrade --install chatwoot
      kubernetes.core.helm:
        name: chatwoot
        chart_ref: chatwoot/chatwoot
        chart_version: "{{ chatwoot_chart_version }}"
        release_namespace: "{{ chatwoot_namespace }}"
        create_namespace: true
        values_files:
          - "/tmp/chatwoot-values.{{ name_prefix }}.yaml"
        wait: true
        wait_timeout: 15m

    # the chart runs a db-migrate job on install. we wait for it, because
    # chatwoot without its migrations is just a very expensive error page.
    - name: Wait for DB migration job to complete
      kubernetes.core.k8s_info:
        api_version: batch/v1
        kind: Job
        namespace: "{{ chatwoot_namespace }}"
        label_selectors:
          - "app.kubernetes.io/instance=chatwoot"
      register: migrate_jobs
      until: >-
        migrate_jobs.resources
        and (migrate_jobs.resources
              | selectattr('metadata.name', 'search', '(db-migrate|migrate)')
              | map(attribute='status.succeeded', default=0)
              | list
              | sum) >= 1
      retries: 60
      delay: 10
      failed_when: false  # the chart may finish migrations before we poll

    # wait for the web pods to be Ready. rails boot is not fast, we've made
    # peace with that. this loop is our meditation time.
    - name: Wait for >= {{ web_replicas }} chatwoot web pods Ready
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ chatwoot_namespace }}"
        label_selectors:
          - "app.kubernetes.io/component=web"
      register: web_deploy
      until: >-
        web_deploy.resources
        and (web_deploy.resources | map(attribute='status.readyReplicas', default=0) | sum) >= web_replicas
      retries: 60
      delay: 10

    # sidekiq next. no workers, no email, no fun. simple as that.
    - name: Wait for >= {{ sidekiq_replicas }} chatwoot sidekiq pods Ready
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ chatwoot_namespace }}"
        label_selectors:
          - "app.kubernetes.io/component=sidekiq"
      register: sk_deploy
      until: >-
        sk_deploy.resources
        and (sk_deploy.resources | map(attribute='status.readyReplicas', default=0) | sum) >= sidekiq_replicas
      retries: 60
      delay: 10

    # read the ingress until the ALB hostname appears. it's like waiting
    # for a text back, but the text is a DNS name.
    - name: Read the ingress to grab the ALB hostname
      kubernetes.core.k8s_info:
        api_version: networking.k8s.io/v1
        kind: Ingress
        namespace: "{{ chatwoot_namespace }}"
      register: ingress_info
      until: >-
        ingress_info.resources
        and (ingress_info.resources[0].status.loadBalancer.ingress[0].hostname | default(''))
            | length > 0
      retries: 60
      delay: 10

    - name: Capture ALB hostname
      ansible.builtin.set_fact:
        alb_hostname: "{{ ingress_info.resources[0].status.loadBalancer.ingress[0].hostname }}"

    # show the hostname so the operator can ooh and aah.
    - name: Show ALB hostname
      ansible.builtin.debug:
        msg: "ALB hostname: {{ alb_hostname }}"

    # ----- Cloudflare app DNS (proxied; Full (Strict)) -----------------
    # now we point the pretty domain at the ALB. proxied through cloudflare
    # so the origin stays hidden like a good little IP address.
    - name: Look up Cloudflare zone ID
      ansible.builtin.uri:
        url: "https://api.cloudflare.com/client/v4/zones?name={{ cloudflare_zone }}"
        method: GET
        headers:
          Authorization: "Bearer {{ lookup('env','CLOUDFLARE_API_TOKEN') }}"
          Content-Type: application/json
        return_content: true
      register: cf_zone

    - name: Fail if zone not found
      ansible.builtin.fail:
        msg: "Cloudflare zone {{ cloudflare_zone }} not visible to this token"
      when: cf_zone.json.result | length == 0

    - name: Set zone id fact
      ansible.builtin.set_fact:
        cf_zone_id: "{{ cf_zone.json.result[0].id }}"

    - name: Look up any existing app DNS record
      ansible.builtin.uri:
        url: "https://api.cloudflare.com/client/v4/zones/{{ cf_zone_id }}/dns_records?name={{ domain }}"
        method: GET
        headers:
          Authorization: "Bearer {{ lookup('env','CLOUDFLARE_API_TOKEN') }}"
          Content-Type: application/json
        return_content: true
      register: cf_existing

    # create the CNAME if it's missing. if it exists we update it below.
    # either way the domain ends up pointed at the ALB. no duplicates, ever.
    - name: Create proxied CNAME record (if missing)
      ansible.builtin.uri:
        url: "https://api.cloudflare.com/client/v4/zones/{{ cf_zone_id }}/dns_records"
        method: POST
        headers:
          Authorization: "Bearer {{ lookup('env','CLOUDFLARE_API_TOKEN') }}"
          Content-Type: application/json
        body_format: json
        body:
          type: CNAME
          name: "{{ domain }}"
          content: "{{ alb_hostname }}"
          ttl: 1
          proxied: true
          comment: "chatwoot-ta managed; ALB origin"
        status_code: [200, 201]
      when: cf_existing.json.result | length == 0

    # redeploys can get a fresh ALB hostname, so an existing record needs a
    # little update love. ttl 1 = dns caching, we don't know her.
    - name: Update existing CNAME record to point at the current ALB
      ansible.builtin.uri:
        url: "https://api.cloudflare.com/client/v4/zones/{{ cf_zone_id }}/dns_records/{{ cf_existing.json.result[0].id }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ lookup('env','CLOUDFLARE_API_TOKEN') }}"
          Content-Type: application/json
        body_format: json
        body:
          type: CNAME
          name: "{{ domain }}"
          content: "{{ alb_hostname }}"
          ttl: 1
          proxied: true
          comment: "chatwoot-ta managed; ALB origin"
        status_code: [200]
      when: cf_existing.json.result | length > 0
