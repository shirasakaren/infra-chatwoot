---
# 20-secrets.yml
# Wire ESO to the Secrets Manager payload that load-secrets.sh wrote, and
# project it as the K8s Secret Chatwoot consumes.
# (load-secrets.sh did the heavy lifting; this playbook is the polite
# butler that hands the secret to the pods. if this fails, the secret is
# fine, it's just that nobody's talking.)

- name: Wire External Secrets Operator to Chatwoot
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../vars/main.yml

  tasks:
    # the chatwoot namespace. everything app-shaped lives here.
    - name: Ensure chatwoot namespace exists
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ chatwoot_namespace }}"
        state: present

    # apply the ClusterSecretStore + ExternalSecret from our template.
    # the template is basically "please go fetch that json and bring it back
    # as env vars". ESO is unreasonably good at this one job.
    - name: Apply ClusterSecretStore + ExternalSecret
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', '../templates/external-secret.yaml.j2') | from_yaml_all | list }}"

    # poll for SecretSynced=True. ESO usually syncs in seconds, but we give
    # it 30 tries because sometimes AWS is just... like that.
    - name: Wait for ExternalSecret to report SecretSynced=True
      kubernetes.core.k8s_info:
        api_version: external-secrets.io/v1beta1
        kind: ExternalSecret
        name: chatwoot-env
        namespace: "{{ chatwoot_namespace }}"
      register: es
      until: >-
        es.resources
        and (es.resources[0].status.conditions | default([]))
            | selectattr('type','equalto','Ready')
            | selectattr('status','equalto','True')
            | list
            | length > 0
      retries: 30
      delay: 5

    # if the K8s Secret doesn't exist by now, something upstream lied to us.
    - name: Confirm K8s Secret was created
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ chatwoot_k8s_secret }}"
        namespace: "{{ chatwoot_namespace }}"
      register: chatwoot_k8s_secret_info
      failed_when: chatwoot_k8s_secret_info.resources | length == 0
